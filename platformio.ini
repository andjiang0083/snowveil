; Snowveil — M5StickS3 (240×135 ST7789)
; 雪夜 · spherical snowfall you can hold in your palm
[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.psram = enable
board_upload.maximum_size = 8388608
lib_deps =
    ; ⚠️ Pin exact versions (including transitive deps): M5Unified only locks
    ; itself — the M5GFX it declares would still drift to the latest, and a
    ; fresh clone would build a different firmware than the one we ship.
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
build_type = release
